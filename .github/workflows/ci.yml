name: SpeakQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  test-and-security:
    name: Tests & Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite (Unit, Integration, Secret Scan)
        run: npm test

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck, test-and-security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-ci-anon-key"
          DATABASE_URL: "postgresql://speakql_app:ci-secret@localhost:5432/speakql_ci"
          NODE_ENV: production
        run: npm run build
