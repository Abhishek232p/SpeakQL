name: Deploy to Cloudflare (OpenNext)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: CF_API_TOKEN
    permissions:
      contents: read
      id-token: write
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '5f22856667f79f66a0671234a757aa2c' }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME || 'speakql' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '5f22856667f79f66a0671234a757aa2c' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_URL: ${{ secrets.DEPLOY_URL || 'https://speakql.abhishekjaiso25.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext -> Cloudflare bundle)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://hwqdufgiiufyknuoierh.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_U9HkatlRa8qBAgtp_UzrJg_YsNftsTm' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PARTNER_NOTIFICATION_EMAIL: ${{ secrets.PARTNER_NOTIFICATION_EMAIL }}
        run: npm run build

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_API_TOKEN secret is not set in GitHub repository secrets. Deployment step will be skipped."
            echo "To enable automated deployment, add CF_API_TOKEN and CF_ACCOUNT_ID in GitHub repo Settings -> Secrets and variables -> Actions."
          else
            echo "Cloudflare credentials detected. Proceeding to deploy."
          fi

      - name: Deploy to Cloudflare (OpenNext)
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PARTNER_NOTIFICATION_EMAIL: ${{ secrets.PARTNER_NOTIFICATION_EMAIL }}
        run: |
          npx opennextjs-cloudflare deploy || npx wrangler deploy

      - name: Post-deploy smoke test
        if: ${{ env.CF_API_TOKEN != '' }}
        run: |
          echo "Running smoke test against $DEPLOY_URL";
          node -e '
            async function check() {
              try {
                const dashRes = await fetch(process.env.DEPLOY_URL + "/dashboard", { redirect: "manual" });
                console.log("/dashboard status:", dashRes.status, "location:", dashRes.headers.get("location"));
                if (![200, 301, 302, 307, 308].includes(dashRes.status)) {
                  console.error("Smoke test failed: /dashboard returned error status:", dashRes.status);
                  process.exit(1);
                }
                const worldRes = await fetch(process.env.DEPLOY_URL + "/world");
                console.log("/world status:", worldRes.status);
                if (worldRes.status !== 200) {
                  console.error("Smoke test failed: /world did not return 200 OK. Status:", worldRes.status);
                  process.exit(1);
                }
                console.log("Smoke tests PASSED successfully!");
              } catch (err) {
                console.error("Smoke test fetch error:", err);
                process.exit(1);
              }
            }
            check();
          '
